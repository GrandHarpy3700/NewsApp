name: Keep Render server warm

# Render's free tier puts the service to sleep after ~15 min of no traffic.
# This workflow pings the lightweight /api/status endpoint every 10 min so
# the server stays awake 24/7 — first-load speed stays fast for you.
#
# GitHub Actions on a public repo is unlimited and free.

on:
  schedule:
    - cron: '*/5 * * * *'    # every 5 minutes — narrowest interval GitHub Actions supports
  workflow_dispatch:         # also lets you trigger manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/status
        run: |
          echo "Pinging at $(date -u)"
          # -f fails on HTTP 4xx/5xx, -s silent, -S still shows errors, --max-time caps wait
          curl -fsS --max-time 60 https://mynews-h1ii.onrender.com/api/status -o /dev/null
          echo "OK"
