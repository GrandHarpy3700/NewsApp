<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icons need a full-bleed background — Android masks the shape -->
  <rect width="512" height="512" fill="#F1F5F9"/>

  <!-- Newspaper kept inside the 80% safe zone so nothing gets cropped -->
  <g transform="translate(112 130)">
    <rect width="288" height="252" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>

    <!-- Masthead -->
    <rect x="0" y="0" width="288" height="62" fill="#0F172A"/>
    <text x="144" y="44" font-family="'Source Serif 4', Georgia, serif"
          font-size="40" font-weight="900" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="2.5">NEWS</text>

    <!-- Headline -->
    <rect x="22" y="78"  width="244" height="16" rx="3" fill="#0F172A"/>
    <rect x="22" y="102" width="160" height="16" rx="3" fill="#0F172A"/>

    <!-- Image -->
    <rect x="22" y="136" width="110" height="80" rx="4" fill="#94A3B8"/>

    <!-- Body -->
    <rect x="148" y="136" width="118" height="9" rx="2" fill="#94A3B8"/>
    <rect x="148" y="151" width="118" height="9" rx="2" fill="#94A3B8"/>
    <rect x="148" y="166" width="100" height="9" rx="2" fill="#94A3B8"/>
    <rect x="148" y="181" width="118" height="9" rx="2" fill="#94A3B8"/>
    <rect x="148" y="196" width="80"  height="9" rx="2" fill="#94A3B8"/>
    <rect x="22"  y="226" width="244" height="9" rx="2" fill="#94A3B8"/>
  </g>
</svg>
