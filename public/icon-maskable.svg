<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Maskable icon: keep important content within the inner 80% (safe zone).
       Full canvas is filled with gradient so Android's masked shape always has a clean background. -->
  <rect width="512" height="512" fill="url(#bg2)"/>
  <g transform="translate(160 176)">
    <rect width="192" height="160" rx="14" fill="#FFFFFF"/>
    <rect x="16" y="20" width="120" height="16" rx="3" fill="#1E293B"/>
    <rect x="16" y="44" width="90" height="10" rx="2" fill="#64748B"/>
    <rect x="16" y="68" width="160" height="48" rx="5" fill="#E2E8F0"/>
    <rect x="16" y="124" width="80" height="8" rx="2" fill="#94A3B8"/>
    <rect x="16" y="138" width="120" height="8" rx="2" fill="#94A3B8"/>
    <rect x="148" y="20" width="44" height="28" rx="4" fill="#F59E0B"/>
  </g>
</svg>
