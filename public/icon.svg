<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Soft background -->
  <rect width="512" height="512" rx="100" fill="#F1F5F9"/>

  <!-- The newspaper — fills most of the canvas -->
  <g transform="translate(56 70)">
    <!-- Paper -->
    <rect width="400" height="372" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="6"/>

    <!-- Dark masthead bar -->
    <rect x="0" y="0" width="400" height="84" fill="#0F172A"/>
    <text x="200" y="60" font-family="'Source Serif 4', Georgia, serif"
          font-size="56" font-weight="900" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="3">NEWS</text>

    <!-- Headline lines -->
    <rect x="30" y="106" width="340" height="22" rx="4" fill="#0F172A"/>
    <rect x="30" y="138" width="230" height="22" rx="4" fill="#0F172A"/>

    <!-- Image area -->
    <rect x="30" y="182" width="160" height="118" rx="6" fill="#94A3B8"/>
    <circle cx="76" cy="220" r="14" fill="#CBD5E1"/>
    <path d="M30 295 L92 250 L150 282 L190 268 L190 300 L30 300 Z" fill="#CBD5E1"/>

    <!-- Body text right of the image -->
    <rect x="210" y="182" width="160" height="12" rx="3" fill="#94A3B8"/>
    <rect x="210" y="202" width="160" height="12" rx="3" fill="#94A3B8"/>
    <rect x="210" y="222" width="140" height="12" rx="3" fill="#94A3B8"/>
    <rect x="210" y="242" width="160" height="12" rx="3" fill="#94A3B8"/>
    <rect x="210" y="262" width="115" height="12" rx="3" fill="#94A3B8"/>
    <rect x="210" y="282" width="160" height="12" rx="3" fill="#94A3B8"/>

    <!-- Body text below the image -->
    <rect x="30" y="318" width="340" height="12" rx="3" fill="#94A3B8"/>
    <rect x="30" y="338" width="270" height="12" rx="3" fill="#94A3B8"/>
  </g>
</svg>
