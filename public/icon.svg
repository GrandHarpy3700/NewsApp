<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F0726" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle back paper (depth) -->
  <g transform="translate(256 256) rotate(-6)">
    <rect x="-170" y="-140" width="340" height="290" rx="10" fill="#F1F5F9" opacity="0.55"/>
  </g>

  <!-- Main newspaper, slight tilt for life -->
  <g transform="translate(256 256) rotate(-2.5) translate(-160 -150)" filter="url(#drop)">
    <!-- Paper -->
    <rect width="320" height="300" rx="9" fill="#FFFFFF"/>

    <!-- Top double-rule -->
    <rect x="0"  y="0"  width="320" height="4"  fill="#0F172A"/>
    <rect x="14" y="11" width="292" height="1.5" fill="#0F172A"/>

    <!-- Masthead -->
    <text x="160" y="62" font-family="'Source Serif 4', Georgia, serif"
          font-size="42" font-weight="900" fill="#0F172A"
          text-anchor="middle" letter-spacing="-1.5">News</text>

    <!-- Sub-rule -->
    <line x1="22" y1="80" x2="298" y2="80" stroke="#0F172A" stroke-width="1"/>
    <text x="160" y="98" font-family="system-ui, sans-serif"
          font-size="11" font-weight="600" fill="#64748B"
          text-anchor="middle" letter-spacing="2.5">DAILY EDITION</text>
    <line x1="22" y1="108" x2="298" y2="108" stroke="#0F172A" stroke-width="1"/>

    <!-- Column 1: image + caption lines -->
    <rect x="22"  y="124" width="130" height="78" rx="4" fill="#CBD5E1"/>
    <circle cx="50" cy="155" r="9" fill="#94A3B8"/>
    <path d="M22 195 L80 165 L130 185 L152 175 L152 202 L22 202 Z" fill="#94A3B8" opacity="0.75"/>
    <rect x="22" y="212" width="130" height="6"  rx="2" fill="#475569"/>
    <rect x="22" y="224" width="100" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="22" y="236" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="22" y="248" width="115" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="22" y="260" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="22" y="272" width="80"  height="6"  rx="2" fill="#94A3B8"/>

    <!-- Column 2: headline + body -->
    <rect x="168" y="124" width="130" height="11" rx="3" fill="#0F172A"/>
    <rect x="168" y="139" width="110" height="11" rx="3" fill="#0F172A"/>
    <rect x="168" y="160" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="172" width="120" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="184" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="196" width="95"  height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="212" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="224" width="115" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="236" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="248" width="130" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="260" width="100" height="6"  rx="2" fill="#94A3B8"/>
    <rect x="168" y="272" width="130" height="6"  rx="2" fill="#94A3B8"/>
  </g>

  <!-- "BREAKING" ribbon (top-right corner) -->
  <g transform="translate(390 90) rotate(14)">
    <rect x="-58" y="-18" width="120" height="36" rx="6" fill="#EF4444"/>
    <text x="2" y="6" font-family="system-ui, sans-serif"
          font-size="13" font-weight="800" fill="#FFFFFF"
          text-anchor="middle" letter-spacing="1.5">BREAKING</text>
  </g>
</svg>
